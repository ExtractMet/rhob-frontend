name: frontend-ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_component.py --check
      - run: node --check components/rhob_3d/src/index.js && for f in static/js/*.js static/js/pages/*.js; do node --check "$f" || exit 1; done
      - run: python -m pytest -q tests --ignore=tests/e2e
  # Optional end-to-end smoke test against a running backend (set E2E_BACKEND_URL secret)
